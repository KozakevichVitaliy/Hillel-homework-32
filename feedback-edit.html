<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css">

  <title>Frontend Mentor | Product feedback app</title>
</head>

<body>
  <div class="container">
    <div class="form-container">
      <a href="#" class="goback">
        <svg width="5" height="10" viewBox="0 0 5 10" fill="none" xmlns="http://www.w3.org/2000/svg" class="detail__back-icon">
          <path d="M4 8.70703L0 4.70703L4 0.707031" stroke-width="2" stroke="#4661E6"/>
        </svg>
        Go Back
      </a>
      <form action="" class="new-feedback__form form" type="submit">
        <h3 class="form__title">Editing ‘Add a dark theme option’</h3>
        <div class="form__input-area">
          <label for="title" class="form__label">
            <span class="form__label-primary">Feedback Title</span>
            <span class="form__label-secondary">Add a short, descriptive headline</span>
          </label>
          <input type="text" name="title" required>
        </div>
        <div class="form__input-area">
          <label for="category" class="form__label">
            <span class="form__label-primary">Category</span>
            <span class="form__label-secondary">Choose a category for your feedback</span>
          </label>
          <select name="category" required>
            <option value="all">All</option>
            <option value="bug">Bug</option>
            <option value="feature">Feature</option>
            <option value="ui">UI</option>
            <option value="ux">UX</option>
            <option value="enhancement">Enhancement</option>
          </select>
        </div>
        <div class="form__input-area">
          <label for="category" class="form__label">
            <span class="form__label-primary">Update Status</span>
            <span class="form__label-secondary">Change feature state</span>
          </label>
          <select name="category" required>
            <option value="all">Suggestion</option>
            <option value="bug">Planned</option>
            <option value="feature">In-Progress</option>
            <option value="ui">Live</option>
          </select>
        </div>
        <div class="form__input-area">
          <label for="detail" class="form__label">
            <span class="form__label-primary">Feedback Detail</span>
            <span class="form__label-secondary">Include any specific comments on what should be improved, added, etc.</span>
          </label>
          <input type="text" name="detail" required>
        </div>
        <div class="form__button">
          <button class="form__button-delete">Delete</button>
          <button class="form__button-cancel">Cancel</button>
          <button type="submit" class="form__button-add">Add Feedback</button>
        </div>
      </form>
    </div>
  </div>
</body>
<html
