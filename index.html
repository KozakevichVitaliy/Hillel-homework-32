<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css">

  <title>Frontend Mentor | Product feedback app</title>
</head>

<body>
  <div class="container">
    <div class="board">
      <header class="toolbar">
        <div class="toolbar__title board__header">
          <a href="#" class="goback goback--white">
            <svg width="5" height="10" viewBox="0 0 5 10" fill="none" xmlns="http://www.w3.org/2000/svg" class="goback__icon">
              <path d="M4 8.70703L0 4.70703L4 0.707031" stroke-width="2" stroke="white"/>
            </svg>
            Go Back
          </a>
          <h1 class="toolbar__title-text">Roadmap</h1>
        </div>
        <button class="toolbar__button button-add">
          + Add Feedback
        </button>
      </header>
      <main class="board__content tasks">
        <div class="tasks__title">
          <div class="tasks__title-planned">
            <h3 class="tasks__title-primary"><span class="dot planned"></span>Planned (<span id="planned-counter">2</span>)</h3>
            <h4 class="tasks__title-secondary">Ideas prioritized for research</h4>
          </div>
          <div class="tasks__title-progress">
            <h3 class="tasks__title-primary"><span class="dot progress"></span>In-Progress (<span id="progress-counter">3</span>)</h3>
            <h4 class="tasks__title-secondary">Currently being developed</h4>
          </div>
          <div class="tasks__title-done">
            <h3 class="tasks__title-primary"><span class="dot done"></span>Done (<span id="done-counter">1</span>)</h3>
            <h4 class="tasks__title-secondary">Released features</h4>
          </div>
        </div>
        <div class="tasks__lists">
          <ul class="tasks-planned tasks__list" id="tasks-planned">
          </ul>
          <ul class="tasks-progress tasks__list" id="tasks-progress">
          </ul>
          <ul class="tasks-done tasks__list" id="tasks-done">
          </ul>
        </div>
      </main>
    </div>
  </div>
  <script src="./scripts/renderTasks.js"></script>
  <script src="./scripts/deleteTask.js"></script>
</body>
<html
